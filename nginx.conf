worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

  # Upstream: 3 API nodes (using host.docker.internal for Docker networking)
  upstream api_cluster {
    least_conn;  # Amdahl's Law: LB adds serial portion
    server host.docker.internal:3001 weight=1;
    server host.docker.internal:3002 weight=1;
    server host.docker.internal:3003 weight=1;
  }

  server {
    listen 8081;
    server_name localhost;

    # Size limits
    client_max_body_size 50m;
    proxy_buffering off;

    # Rate limit applies here (serial bottleneck)
    limit_req zone=api_limit burst=50 nodelay;

    location / {
      proxy_pass http://api_cluster;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    location /health {
      return 200 "LB OK\n";
      add_header Content-Type text/plain;
    }

    location /stats {
      proxy_pass http://api_cluster/stats;
    }
  }
}
